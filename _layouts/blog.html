<!doctype html>
<html lang="pl">
    {% include head.html %}
    <body>
        {% include header.html %}
        <main class="container">

        <h1>Blog</h1>
        <ul>
            {% for post in site.posts %}
                <li>
                    <a href="{{ post.url }}">{{ post.date | date: "%Y-%m-%d"}} {{ post.title }}</a>
                </li>
            {% endfor %}
        </ul>
        </main>

        {% include footer.html %}
    </body>
</html>
